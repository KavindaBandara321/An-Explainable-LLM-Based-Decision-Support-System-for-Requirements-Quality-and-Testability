services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: story-quality-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Read from api/.env (docker compose picks it up automatically).
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in api/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
